  <rect width="760" height="590" rx="10" fill="#15161A"/>
  <rect width="760" height="34" rx="10" fill="#1E1F25"/>
  <rect y="24" width="760" height="10" fill="#1E1F25"/>
  <circle cx="24" cy="17" r="5" fill="#E8705E"/>
  <circle cx="42" cy="17" r="5" fill="#D9A441"/>
  <circle cx="60" cy="17" r="5" fill="#6FBF8B"/>
  <text x="380" y="22" fill="#9A9A92" font-size="12" text-anchor="middle">examples/quota-app</text>
  <text class="l0" x="26" y="74" fill="#7C7C74"># An agent was asked to fix “paying users are throttled after upgrading”.</text>
  <text class="l1" x="26" y="95" fill="#8FAFC4">$ git diff --stat</text>
  <text class="l2" x="26" y="116" fill="#D9D9D3"> src/quota.test.ts |  7 +++++--</text>
  <text class="l3" x="26" y="137" fill="#D9D9D3"> src/quota.ts      | 15 +++++++++------</text>
  <text class="l4" x="26" y="158" fill="#8FAFC4">$ npm test</text>
  <text class="l5" x="26" y="179" fill="#6FBF8B"> Test Files  1 passed (1)</text>
  <text class="l6" x="26" y="200" fill="#6FBF8B">      Tests  4 passed (4)</text>
  <text class="l7" x="26" y="221" fill="#7C7C74"># Green. The suite the agent maintains agrees with the code the agent wrote.</text>
  <text class="l8" x="26" y="242" fill="#8FAFC4">$ maru verify --diff</text>
  <text class="l9" x="26" y="263" fill="#9A9A92">Risk: MODERATE (30/100)  ·  Related contract: usage-quota</text>
  <text class="l10" x="26" y="284" fill="#E8705E">Verification gate: BLOCKED</text>
  <text class="l11" x="26" y="305" fill="#D9D9D3">Findings: 5 (5 blocking)</text>
  <text class="l12" x="26" y="326" fill="#E8705E">[HIGH] BLOCKING  QUOTA-001 verification failed</text>
  <text class="l13" x="26" y="347" fill="#D9D9D3">  Expected: Free plan users may perform at most 10 generations per month.</text>
  <text class="l14" x="26" y="368" fill="#D9D9D3">  Actual:   Received: "pro"</text>
  <text class="l15" x="26" y="389" fill="#E8705E">[HIGH] BLOCKING  QUOTA-INV-001 verification failed</text>
  <text class="l16" x="26" y="410" fill="#D9D9D3">  Expected: The plan tier must be read from the stored subscription record</text>
  <text class="l17" x="26" y="431" fill="#D9D9D3">            and never from client-supplied request data.</text>
  <text class="l18" x="26" y="452" fill="#8FAFC4">$ maru drift check --from observations.json</text>
  <text class="l19" x="26" y="473" fill="#E8705E">Semantic drift: BLOCKED   Conflicts: 2 (2 blocking)</text>
  <text class="l20" x="26" y="494" fill="#9A9A92">[usage-quota#QUOTA-001]</text>
  <text class="l21" x="26" y="515" fill="#D9D9D3">  Contract: at most 10 generations per calendar month</text>
  <text class="l22" x="26" y="536" fill="#D9A441">  Observed: at most 1000 generations per calendar month</text>
  <text class="l23" x="26" y="557" fill="#7C7C74"># The tests moved. The contract did not. Approval stays human-owned.</text>
</svg>
