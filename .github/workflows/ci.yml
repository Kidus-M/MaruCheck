name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  example:
    name: Runnable example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Block the agent's change in examples/quota-app
        run: node examples/quota-app/run.mjs

  # Informational only, and non-blocking: it finds out whether MaruCheck actually works on the
  # Node versions its engines field currently excludes. Installing with engine-strict disabled is
  # deliberate — the declared range is the thing under test. See docs/contributing/starter-issues.md.
  node-compatibility:
    name: Node ${{ matrix.node }} (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci --engine-strict=false

      - name: Check
        run: npm run check

      - name: Block the agent's change in examples/quota-app
        run: node examples/quota-app/run.mjs
