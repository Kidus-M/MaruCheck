name: Release CLI

# Two ways in:
#   1. Push to main -> release-please keeps a "chore: release vX.Y.Z" PR warm.
#      Merging that PR creates the tag + GitHub Release, and we publish right here.
#   2. Push a v* tag by hand -> the old manual path still works, unchanged.
# The filename stays publish.yml on purpose: npm trusted publishing is pinned to it.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  cancel-in-progress: false
  group: cli-release-${{ github.ref }}

jobs:
  release-please:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Prepare or cut the release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # always() so a hand-pushed tag still runs while release-please sits this one out.
    if: >-
      always() &&
      needs.release-please.result != 'failure' &&
      (github.ref_type == 'tag' || needs.release-please.outputs.release_created == 'true')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Require tag to match package version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"

      - name: Run release quality gate
        run: npm run check

      - name: Verify public release metadata
        run: npm run verify:release-metadata

      - name: Pack public artifact
        id: package
        shell: bash
        run: |
          archive=$(npm pack --ignore-scripts --silent)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Install artifact as a consumer
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/marucheck-consumer"
          npm install --prefix "$RUNNER_TEMP/marucheck-consumer" --ignore-scripts --no-audit --no-fund "./${{ steps.package.outputs.archive }}"
          node "$RUNNER_TEMP/marucheck-consumer/node_modules/marucheck/dist/maru.cjs" --version

      - name: Check whether npm version already exists
        id: registry
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "marucheck@$version" version --silent > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "marucheck@$version is already present on npm; keeping the immutable version."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish public package with provenance
        if: steps.registry.outputs.publish == 'true'
        run: npm publish --ignore-scripts --provenance --access public

      - name: Create package checksum
        shell: bash
        run: sha256sum "${{ steps.package.outputs.archive }}" > "${{ steps.package.outputs.archive }}.sha256"

      # release-please already wrote the notes; on that path we only bolt on the tarball.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="${{ steps.package.outputs.archive }}"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
              --generate-notes \
              --latest \
              --title "MaruCheck CLI $RELEASE_TAG"
          fi
