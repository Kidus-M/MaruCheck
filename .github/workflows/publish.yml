name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  cancel-in-progress: false
  group: cli-release-${{ github.ref }}

jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Require tag to match package version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Run release quality gate
        run: npm run check

      - name: Verify public release metadata
        run: npm run verify:release-metadata

      - name: Pack public artifact
        id: package
        shell: bash
        run: |
          archive=$(npm pack --ignore-scripts --silent)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Install artifact as a consumer
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/marucheck-consumer"
          npm install --prefix "$RUNNER_TEMP/marucheck-consumer" --ignore-scripts --no-audit --no-fund "./${{ steps.package.outputs.archive }}"
          node "$RUNNER_TEMP/marucheck-consumer/node_modules/marucheck/dist/maru.cjs" --version

      - name: Check whether npm version already exists
        id: registry
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "marucheck@$version" version --silent > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "marucheck@$version is already present on npm; keeping the immutable version."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish public package with provenance
        if: steps.registry.outputs.publish == 'true'
        run: npm publish --ignore-scripts --provenance --access public

      - name: Create package checksum
        shell: bash
        run: sha256sum "${{ steps.package.outputs.archive }}" > "${{ steps.package.outputs.archive }}.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="${{ steps.package.outputs.archive }}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
              --generate-notes \
              --latest \
              --title "MaruCheck CLI $GITHUB_REF_NAME"
          fi
