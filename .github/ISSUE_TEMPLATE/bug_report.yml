name: Bug report
description: A command behaved differently from what it documents
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A verdict you disagree with is a bug report too. MaruCheck's decisions are meant to be
        arguable, so include the evidence and say what you expected instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what it printed. Redact anything sensitive.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        A minimal project, a diff shape, or a change to `examples/quota-app` that shows it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Relevant parts of `.maru/generated/verification-plan.json`, the run's `report.json`, or the
        raw adapter output under `.maru/artifacts/runs/`.
      render: json
  - type: input
    id: version
    attributes:
      label: MaruCheck version
      placeholder: "0.4.0 (maru --version)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version, package manager, and operating system
      placeholder: "Node 24.4.0, npm 11.3.0, Ubuntu 24.04"
    validations:
      required: true
